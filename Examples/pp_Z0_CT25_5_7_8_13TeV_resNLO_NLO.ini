# pp_multiTeV_WpWmCT25_resNLO_NLO.ini  --  W+ / W- at 5/7/8/13 TeV in ONE campaign,
#                                           built from templates/13TeV_WpWm
#
#   python3 run_process.py pp_Z0_CT25_5_7_8_13TeV_resNLO_NLO.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py pp_Z0_CT25_5_7_8_13TeV_resNLO_NLO.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file.
#
# NOTE on the shared grid: templates/7TeV_WpWm's y_grid.inp (+-5.00) clips the true kinematic
# edge at 13 TeV -- at qT=0, Q=M_W the boson-rapidity boundary is
# y_max = acosh((ECM^2+Q^2)/(2*ECM*sqrt(qT^2+Q^2))) ~ 5.09 at 13 TeV (vs ~4.60/4.47/4.14 at
# 8/7/5 TeV, all comfortably inside +-5.00). templates/13TeV_WpWm is a copy of templates/
# 7TeV_WpWm with y_grid.inp extended to +-5.60 (155 points: the same 143-point +-5.00 grid,
# plus 6 more 0.1-spaced points on each tail, matching the existing tail's own step size) --
# same ~0.5 margin above the resonance edge that the 7 TeV grid keeps above its own 4.47. Since
# that margin only grows at lower ECM, this ONE grid safely covers all four energies below --
# points beyond the kinematic boundary just come back zero (w_pert.f/w_asym.f's YMAXIMUM check,
# legacy's pert.for/res.for YMAX+x_a/x_b>=1 check), never a crash, so this only affects
# coverage, not correctness. When adding a HIGHER energy than 13 TeV, extend y_grid.inp first
# (or build a new template) -- a narrower grid does not automatically cover a wider one.
# q_grid.inp/qt_grid.inp are untouched (Q up to 5000 GeV and qT up to 3000 GeV already exceed
# anything reachable at 13 TeV, and this keeps the fine, resonance-tuned Q sampling validated
# against Example_E211_ATLAS8TeV_WpWm) -- also shared across all four energies below.

[paths]
source = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/13TeV_WpWm             # folder with get_yk_new/ legacy/ resbos/ w_asym/ w_pert/ -- SHARED by every energy in [energies]
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/pp_Z0_CT25_5_7_8_13TeV_resNLO_NLOO                 # NEW folder: what a run needs is copied here and the jobs run here
scripts  = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/scripts          # default: the scripts folder next to run_process.py
stage_outputs  = link                   # how get_yk_new / resbos receive the outputs of earlier steps:
                                          #   link (default, relative symlinks) or copy (real files, +~1 GB per boson)

[campaign]
# name / ecm: omitted here -- each energy below supplies its own file prefix and ecm instead
# (see [energies]). Everything else in this file (processes/pdf/order/compute, and every other
# section) is shared across all four energies -- that's the point of this feature: run the same
# process at several energies from one .ini instead of copying the file per energy.
processes  = Z0                       # the whole chain runs for each one (W+ and W- are supported)
pdf        = CT25NLO                     # LHAPDF set; the .in files get "lha_<pdf>"; must be installed on the HPCC
order      = NLO                          # get_yk_new order (NNLO needs real R_Ai tables, see [get_yk_new])
compute    = resNLO, NLO                  # the option this example demonstrates -- also valid: "NLO" or "resNLO" alone

[energies]
# <label> = <ecm_GeV>, <file_prefix>   -- one line per energy this campaign runs at.  The label
# (left of "=") is only used in log/echo messages; the prefix (2nd value) is what every job/
# output filename for that energy starts with, so PICK A UNIQUE ONE PER ENERGY -- run_process.py
# refuses two energies with the same prefix.  All energies below share [paths] source above and
# every other section of this file ([templates]/[grids]/[shards]/[legacy]/[resbos]/...).
5TeV  = 5000,  pp5TeVCT25NLO
7TeV  = 7000,  pp7TeVCT25NLO
8TeV  = 8000,  pp8TeVCT25NLO
13TeV = 13000, pp13TeVCT25NLO

[executables]                             # default: bin/<folder>/<exe>, the fresh build made by  sbatch setup_resbos_legacy.sb
                                          # (bin/ next to run_process.py).  The old executables inside the source are NOT used.
dir        = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin                        # another <dir>/<folder>/<exe> (relative to this file); may be a template folder
# w_pert     = /path/to/w_pert            # or one key per code; each one wins over dir
# w_asym     = /path/to/w_asym
# legacy     = /path/to/main
# get_yk_new = /path/to/get_yk_new
# resbos     = /path/to/resbos_root

[templates]                               # the source's W+ .in files (relative to source); W- and all the new values
                                          # (energy, PDF, boson, grid range) are derived from them
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in          # LTO=3 -> input of get_yk_new
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in     # LTO=0 -> "Main data grid" of resbos
w_pert      = w_pert/7TeV_w_pert_Wp.in
w_asym      = w_asym/7TeV_w_asym_Wp.in
resbos      = resbos/7TeV_Wp_resbos.in

[grids]
# Default: the full grid in <folder>/inp/{q,qt,y}_grid.inp -- here templates/13TeV_WpWm's
# 153 qT x 155 y (extended to +-5.60, see note above) x 80 Q.  w_pert, w_asym and legacy must
# have identical grids; the script checks this (md5) and stops otherwise.  Optional sub-range:
# active = 1 153 1  1 155 1  1 80 1       # qT_min qT_max step   y_min y_max step   Q_min Q_max step
#
# ExpCustomGrid mode -- one job per (y,Q) row of a real experimental data table, instead of one shared
# rectangular grid (only w_pert/w_asym/legacy run; get_yk_new/resbos need one shared Yk grid for the
# whole campaign, so they're skipped entirely in this mode).  Use this when the table's unique-Q x
# unique-y product would be much bigger than its row count (make_grid_from_data.py prints that count --
# if it's small, build a normal rectangular grid with that script instead, no need for this mode):
# experimental = /path/to/data_table      # whitespace-separated, one row per point; '#'/blank lines skipped
# exp_y_col    = 1                        # 1-based column holding y (default 1, matches Yao's tables)
# exp_q_col    = 2                        # 1-based column holding Q (default 2)
# throttle     = 20                       # optional: SLURM --array=1-N%20 (cap concurrent point jobs)

[shards]                                  # split along Q; 1 = a single array task.  resbos is never sharded.
legacy     = 20                           # ~16 h serial for the full grid
w_pert     = 5                            # ~3 h serial
w_asym     = 5

[get_yk_new]
# Only for order = NNLO.  With NLO an all-ones R_Ai table is generated (identical result).
# r_ai_Wp = /path/to/R_Ai_wp.txt
# r_ai_Wm = /path/to/R_Ai_wm.txt

[legacy]                                # optional overrides of the legacy .in files (legacy_Y and legacy_main both)
bmax    = 0.5
nonpert = 0.21d0, 0.68d0, -0.126d0, 1.6d0, 1     # g1, g2, g3, Q0, nG  (BLNY)
ibeam   = 1                             # iBeam=-2/-1/0/1: PiN/ppB/pN/pp (default: the template's own value, 1=pp)
fract_n = 0.0d0                        # fraction of neutrons in the nucleus (IBEAM=0 only, e.g. 0.54 for Cu)

[resbos]                                # optional: every key not given keeps the value of the resbos template
runs    = nocuts                 # one resbos job per name (default: a single run "default" with the
                                          # template's own cuts); a name other than "default" may have a
                                          # [cuts.<name>] section overriding only what differs.  List every run you
                                          # want here before the first --submit: w_pert/w_asym/legacy/get_yk_new
                                          # don't depend on this section, so all runs share the same upstream jobs.
                                          # Adding a run to an ALREADY FINISHED campaign?  Don't rerun normally
                                          # (it would resubmit the whole ~16h+3h chain) -- add it here and use
                                          #   python3 run_process.py THIS.ini --resbos-only --submit
                                          # which only (re)submits the resbos job(s), reusing the existing
                                          # legacy/get_yk_new outputs in dest/ directly.
# vegas   = 1,30,30000,50,500000          # iGen, ITMX1, NCALL1, ITMX2, NCALL2
# seed    = 182019
# lumi    = 1.0                           # pb^-1
# output  = ROOTNT2
# qwindow = 10.0, 150.0                   # value substituted for {qwindow} in the cut lines below
#
# [cuts.atlas]                            # e.g. ATLAS W -> mu nu: pT>25, |eta|<2.4, MT>40, ETmiss>25
# lepton    = 25.0, -10, 0.0, 10000.0, 2.4                # PTECUT, YECUT(-10 = no minimum), DelR, PTNCUT(max), YnCut(max |eta|)
# mass_qt_y = {qwindow}, 0.0, 8000.0, -99.0, 99.0         # QMn, QMx, QTMn, QTMx, yWmn, yWmx
# mt_met    = 40.0, 10000., 25.0                          # MT min, MT max, ETmiss min
#
[cuts.nocuts]                           # no lepton cuts: cut later on the ntuple
lepton    = 0.0, -10, 0.0, 15000.0, 99.0
mt_met    = 0.0, 15000., 0.0

[environment]                           # optional; the defaults are the ones in the working example's .sb files
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
