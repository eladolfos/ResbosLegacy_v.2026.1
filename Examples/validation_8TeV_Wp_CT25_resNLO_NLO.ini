# validation_8TeV_Wp_CT25_resNLO_NLO.ini -- W+ resNLO + NLO at LHC 8 TeV, ECM = 8000 GeV
#
# Validation set: W+ only, compute = resNLO, NLO, so resNLO, nloasy and nlodsi come out together and
# validate_campaign.py can check resNLO ~ nloasy + nlodsi and that every piece is finite.
# Grid window: Full Q grid (max 5000 < ECM=8000).
# Forbidden (Q,qT) cells (X=(ECM^2+Q^2)/(2*ECM*sqrt(Q^2+qT^2)) < 1) are zero-weighted by the
# YMAXIMUM guard in resbosm.f; resbos must be rebuilt with it (sbatch setup_resbos_legacy.sb).
#
#   python3 run_process.py Examples/validation_8TeV_Wp_CT25_resNLO_NLO.ini --submit
#
# Add W- by changing processes to "W+, W-" (doubles the run time).

[paths]
source = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/7TeV_WpWm
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/validation_8TeV_Wp_CT25_resNLO_NLO
scripts = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/scripts
stage_outputs = link

[campaign]
name       = pp8TeVCT25NLO
ecm        = 8000
processes  = W+
pdf        = CT25NLO
order      = NLO
compute    = resNLO, NLO

[executables]
dir        = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin

[templates]
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in
w_pert      = w_pert/7TeV_w_pert_Wp.in
w_asym      = w_asym/7TeV_w_asym_Wp.in
resbos      = resbos/7TeV_Wp_resbos.in

[grids]
active = 1 153 1  1 143 1  1 80 1       # qT_min qT_max step   y_min y_max step   Q_min Q_max step
# Full Q grid (max 5000 < ECM=8000).
#
#   Q-grid index 47 = 1700, 49 = 1900, 79 = 4900, 80 = 5000 GeV (q_grid.inp).

[shards]
legacy     = 20
w_pert     = 5
w_asym     = 5

[legacy]
ibeam   = 1

[resbos]
runs    = nocuts

[cuts.nocuts]
lepton    = 0.0, -10, 0.0, 15000.0, 99.0
mt_met    = 0.0, 15000., 0.0

[environment]
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
