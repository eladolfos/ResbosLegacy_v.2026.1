# production_7TeV_WpWmZ0_CT25_resNLO_NLO.ini -- W+, W- and Z0, resNLO + NLO, ECM set by [campaign]
#
# Production set: same window, PDF, shards and cuts as the validation_7TeV_Wp_CT25_resNLO_NLO.ini
# file, which passed validate_campaign.py. Job names carry a "prod" prefix so the analysis job of
# this run does not wait on the validation runs and vice versa.
# Requires resbos rebuilt with the YMAXIMUM guard (sbatch setup_resbos_legacy.sb).
#
#   python3 run_process.py Examples/production_7TeV_WpWmZ0_CT25_resNLO_NLO.ini --submit
#
# Each boson runs its own chain (legacy x4 pieces, w_pert, w_asym, get_yk_new, resbos x3). Expect
# roughly three times the validation run's wall time, since the chains run in parallel per boson.
#
[paths]
source = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/7TeV_WpWm
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/production_7TeV_WpWmZ0_CT25_resNLO_NLO
scripts = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/scripts
stage_outputs = link

[campaign]
name       = prodpp7TeVCT25NLO
ecm        = 7000
processes  = W+, W-, Z0
pdf        = CT25NLO
order      = NLO
compute    = resNLO, NLO

[executables]
dir        = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin

[templates]
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in
w_pert      = w_pert/7TeV_w_pert_Wp.in
w_asym      = w_asym/7TeV_w_asym_Wp.in
resbos      = resbos/7TeV_Wp_resbos.in

[grids]
active = 1 153 1  1 143 1  1 80 1       # qT_min qT_max step   y_min y_max step   Q_min Q_max step
# Full Q grid (max 5000 < ECM=7000). No cell is kinematically forbidden except at Q~5000, qT>~1700 (zero-weighted by the guard).
#
#   Q-grid index 47 = 1700, 49 = 1900, 79 = 4900, 80 = 5000 GeV (q_grid.inp).

[shards]
legacy     = 10
w_pert     = 5
w_asym     = 5

[legacy]
ibeam   = 1

[resbos]
runs    = nocuts

[cuts.nocuts]
lepton    = 0.0, -10, 0.0, 15000.0, 99.0
mt_met    = 0.0, 15000., 0.0

[environment]
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
