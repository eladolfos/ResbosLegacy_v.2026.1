# ppbar_WpWm_CT25_Tevatron_1960_resNLO_NLO.ini  --  W+ / W- at Tevatron Run II (1.96 TeV), built
#                                           from templates/Tevatron_WpWm (p-pbar, not p-p).
#                                           Single-energy sibling of ..._1800_1960_resNLO_NLO.ini
#                                           (that one shares [grids] active across both energies,
#                                           capping this energy at Run I's tighter Q limit -- this
#                                           file and ..._1800_resNLO_NLO.ini give each energy its
#                                           own optimal cap instead; see the NOTE below).
#
#   python3 run_process.py Examples/ppbar_WpWm_CT25_Tevatron_1960_resNLO_NLO.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py Examples/ppbar_WpWm_CT25_Tevatron_1960_resNLO_NLO.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file (Examples/); [paths] below uses absolute HPCC paths.
#
# NOTE on p-pbar vs p-p: Tevatron collides protons on ANTIprotons, unlike every other example in
# this repo (all p-p: LHC, or a nuclear/fixed target). This needs iBeam=-1 (ppB), not iBeam=1
# (pp), in EVERY code that reads it -- Legacy (legacy_Y/legacy_main/legacy_dsi/legacy_asy),
# w_pert AND w_asym. Until this campaign was built, [legacy] ibeam in the .ini only patched
# Legacy's own .in files; w_pert/w_asym's "ECM,iBeam=-1,1:ppB/pp" line was never touched by
# run_process.py and silently stayed at whatever [templates] w_pert/w_asym hardcoded (1/pp in
# every existing template) -- Legacy would have correctly switched to ppbar while w_pert/w_asym
# silently kept computing pp, corrupting get_yk_new's K-factor without any error. Fixed in
# run_process.py: patch_stage() now also propagates [legacy] ibeam to w_pert/w_asym whenever the
# value is one they support (1 or -1 -- w_pert.f/w_asym.f have no genuine nuclear/pion-target
# mode, so ibeam=0/-2 leaves them at their template's own value, same as before: the established
# E605 approach, where the nuclear-target physics lives entirely in Legacy's iBeam/FRACT_N).
# resbos needs no separate fix: resbos_root.f reads IBEAM from the "Main data grid" header that
# Legacy itself writes (YUAN_MAIN, `Read(2,*) ECMC, iBeam, nDummy, LTOpt, iProc`), so it already
# inherits the correct value automatically once Legacy's is correct.
#
# The underlying physics genuinely supports p-pbar (verified by reading the source, not assumed
# from ResBos's Tevatron heritage alone): w_pert.f/w_asym.f's W- "hotfix" (flip both hadrons'
# PDF species and reuse the W+ formula) is exact for p-pbar too, confirmed here by an explicit
# charge-conjugation derivation -- NOT just for the symmetric p-p case its own comment describes.
# legacy_final_vesion/pert.for's fgetpert() has a genuine dedicated `spertppbar` subroutine for
# ibeam=-1 (a defensive `CALL QUIT` inside the OTHER subroutine, spertpN, for ibeam=-1 is dead
# code -- the dispatcher already routes ppbar to spertppbar before ever reaching it); res.for has
# explicit separate IBEAM=-1/1/0/-2 branches throughout. templates/Tevatron_WpWm is otherwise a
# byte-for-byte copy of templates/7TeV_WpWm (its q/qt/y grid, already wider than any of the LHC
# energies this repo targets, comfortably covers 1.8-1.96 TeV too -- at qT=0, Q=M_W the
# boson-rapidity boundary y_max = acosh((ECM^2+Q^2)/(2*ECM*sqrt(qT^2+Q^2))) is only ~3.1-3.2 at
# Tevatron energies, vs the grid's own +-5.00 edge, by far the most margin of any campaign in
# this repo) -- ONLY the iBeam tokens in all 8 .in files (legacy x4, w_pert x2, w_asym x2) were
# changed to -1, so this template "just works" even without [legacy] ibeam set below; it's set
# explicitly anyway for clarity, matching how other campaigns restate their own key physics
# choices in [legacy] even when the template default already provides them.
#
# NOTE on the Q grid range -- the y-margin above does NOT mean the grid is safe to run
# unmodified: q_grid.inp runs up to Q=5000 GeV (sized for LHC energies, where it's always a small
# fraction of ECM), but at Tevatron energies any Q point can fail a hard kinematic floor.
# legacy_final_vesion/pert.for's PERTURB (the real-emission piece behind the Y-grid) computes, per
# grid point (Q_V, QT_V, Y_V):
#   TM_V   = sqrt(QT_V^2 + Q_V^2)                      (transverse mass)
#   RTAUP  = (TM_V + QT_V) / ECM
#   X1LOW  = RTAUP * exp(Y_V);   X2LOW = RTAUP / exp(Y_V)
# and calls `CALL QUIT` (killing the whole shard) the moment BOTH X1LOW and X2LOW exceed 1 --
# which happens first (smallest QT_V, Y_V=0, where X1LOW=X2LOW=RTAUP~=Q_V/ECM) as soon as
# Q_V > ECM: a parton can't carry more momentum than its own hadron. At Run I's ECM=1800 GeV this
# killed every Q>=1900 GeV shard (confirmed by an actual run: RTAUP=1900.09/1800=1.0556>1).
# Run II's higher ECM=1960 GeV pushes that edge up: for Q_V=1900 GeV (grid index 49),
# RTAUP=1900.09/1960=0.9695 -- comfortably <1, safe -- while Q_V=2000 GeV (index 50) gives
# RTAUP=2000.09/1960=1.0205>1, unsafe. Hence [grids] active below caps Q at index 49 (=1900 GeV),
# one grid point higher than the Run I file (..._1800_resNLO_NLO.ini, capped at index 48) can use
# -- not a resource/timeout issue, a hard physical limit tied to ECM.

[paths]
source = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/Tevatron_WpWm            # folder with get_yk_new/ legacy/ resbos/ w_asym/ w_pert/
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/ppbar_WpWm_CT25_Tevatron_1960_resNLO_NLO     # NEW folder: what a run needs is copied here and the jobs run here
scripts  = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/scripts          # default: the scripts folder next to run_process.py
stage_outputs  = link                   # how get_yk_new / resbos receive the outputs of earlier steps:
                                          #   link (default, relative symlinks) or copy (real files, +~1 GB per boson)

[campaign]
name       = Tev1p96TeVCT25NLO            # prefix of every file; keep it short (the Fortran codes truncate paths at 100 chars)
ecm        = 1960                         # GeV -> written into the w_pert, w_asym and legacy .in files -- Tevatron Run II ("1.96 TeV")
processes  = W+, W-                       # the whole chain runs for each one
pdf        = CT25NLO                     # LHAPDF set; the .in files get "lha_<pdf>"; must be installed on the HPCC --
                                          # swap for a Tevatron-era-specific set here if you want one instead (e.g. a
                                          # CTEQ6/CT10/CT14-family fit); CT25NLO covers the relevant x,Q2 range fine either way
order      = NLO                          # get_yk_new order (NNLO needs real R_Ai tables, see [get_yk_new])
compute    = resNLO, NLO                  # the option this example demonstrates -- also valid: "NLO" or "resNLO" alone

[executables]                             # default: bin/<folder>/<exe>, the fresh build made by  sbatch setup_resbos_legacy.sb
                                          # (bin/ next to run_process.py).  The old executables inside the source are NOT used.
dir        = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin                        # another <dir>/<folder>/<exe> (relative to this file); may be a template folder
# w_pert     = /path/to/w_pert            # or one key per code; each one wins over dir
# w_asym     = /path/to/w_asym
# legacy     = /path/to/main
# get_yk_new = /path/to/get_yk_new
# resbos     = /path/to/resbos_root

[templates]                               # the source's W+ .in files (relative to source); W- and all the new values
                                          # (energy, PDF, boson, grid range) are derived from them
legacy_Y    = legacy/Tevatron_legacy_Wp_W321.in          # LTO=3 -> input of get_yk_new
legacy_main = legacy/Tevatron_legacy_Wp_W321_main.in     # LTO=0 -> "Main data grid" of resbos
w_pert      = w_pert/Tevatron_w_pert_Wp.in
w_asym      = w_asym/Tevatron_w_asym_Wp.in
resbos      = resbos/Tevatron_Wp_resbos.in

[grids]
# Default: the full grid in <folder>/inp/{q,qt,y}_grid.inp -- templates/Tevatron_WpWm's UNCHANGED
# 153 qT x 143 y (+-5.00) x 80 Q from templates/7TeV_WpWm (see the note above: Tevatron's own
# kinematic edge, ~3.1-3.2 in y, sits well inside this without needing any extension).  w_pert,
# w_asym and legacy must have identical grids; the script checks this (md5) and stops otherwise.
# Optional sub-range:
active = 1 153 1  1 143 1  1 49 1       # qT_min qT_max step   y_min y_max step   Q_min Q_max step
# Q capped at grid index 49 (q_grid.inp line 49 = 1900.0 GeV): this file's ecm=1960 makes Q=1900
# safe (RTAUP=1900.09/1960=0.9695<1) but Q=2000 (index 50) unsafe (RTAUP=1.0205>1) -- see the
# derivation in the NOTE at the top of this file. Q-shards above this index die within seconds
# with legacy's "ERROR IN PERTURB. x1Low, x2Low = ...", "Stopping in QUIT." -- a hard physical
# limit, not a resource/timeout issue. Don't raise this past 49 at ecm=1960; if ecm changes, the
# safe index is the largest one with q_grid.inp value <= ecm (recompute, don't assume 49 still
# holds).

#
# ExpCustomGrid mode -- one job per (y,Q) row of a real experimental data table, instead of one shared
# rectangular grid (only w_pert/w_asym/legacy run; get_yk_new/resbos need one shared Yk grid for the
# whole campaign, so they're skipped entirely in this mode).  Use this when the table's unique-Q x
# unique-y product would be much bigger than its row count (make_grid_from_data.py prints that count --
# if it's small, build a normal rectangular grid with that script instead, no need for this mode):
# experimental = /path/to/data_table      # whitespace-separated, one row per point; '#'/blank lines skipped
# exp_y_col    = 1                        # 1-based column holding y (default 1, matches Yao's tables)
# exp_q_col    = 2                        # 1-based column holding Q (default 2)
# throttle     = 20                       # optional: SLURM --array=1-N%20 (cap concurrent point jobs)

[shards]                                  # split along Q; 1 = a single array task.  resbos is never sharded.
legacy     = 20                           # ~16 h serial for the full grid
w_pert     = 5                            # ~3 h serial
w_asym     = 5

[get_yk_new]
# Only for order = NNLO.  With NLO an all-ones R_Ai table is generated (identical result).
# r_ai_Wp = /path/to/R_Ai_wp.txt
# r_ai_Wm = /path/to/R_Ai_wm.txt

[legacy]                                # optional overrides of the legacy .in files (legacy_Y and legacy_main both) --
                                          # w_pert/w_asym now pick up ibeam too (see the note at the top of this file)
bmax    = 0.5
nonpert = 0.21d0, 0.68d0, -0.126d0, 1.6d0, 1     # g1, g2, g3, Q0, nG  (BLNY)
ibeam   = -1                            # iBeam=-2/-1/0/1: PiN/ppB/pN/pp -- Tevatron is p-pbar (ppB); the
                                          # templates/Tevatron_WpWm default already has this set, so this line
                                          # is a belt-and-suspenders restatement, not strictly required here
fract_n = 0.0d0                        # fraction of neutrons in the nucleus (IBEAM=0 only, e.g. 0.54 for Cu) -- unused (ibeam!=0)

[resbos]                                # optional: every key not given keeps the value of the resbos template
runs    = nocuts                 # one resbos job per name (default: a single run "default" with the
                                          # template's own cuts); a name other than "default" may have a
                                          # [cuts.<name>] section overriding only what differs.  List every run you
                                          # want here before the first --submit: w_pert/w_asym/legacy/get_yk_new
                                          # don't depend on this section, so all runs share the same upstream jobs.
                                          # Adding a run to an ALREADY FINISHED campaign?  Don't rerun normally
                                          # (it would resubmit the whole ~16h+3h chain) -- add it here and use
                                          #   python3 run_process.py THIS.ini --resbos-only --submit
                                          # which only (re)submits the resbos job(s), reusing the existing
                                          # legacy/get_yk_new outputs in dest/ directly.
# vegas   = 1,30,30000,50,500000          # iGen, ITMX1, NCALL1, ITMX2, NCALL2
# seed    = 182019
# lumi    = 1.0                           # pb^-1
# output  = ROOTNT2
# qwindow = 10.0, 150.0                   # value substituted for {qwindow} in the cut lines below
#
# [cuts.cdf]                              # ILLUSTRATIVE ONLY -- ballpark CDF Run II W -> e nu-style
# lepton    = 25.0, -10, 0.0, 10000.0, 1.1                # PTECUT, YECUT(-10=no minimum), DelR, PTNCUT(max), YnCut(max |eta|, CDF central calo ~1.1)
# mass_qt_y = {qwindow}, 0.0, 8000.0, -99.0, 99.0         # QMn, QMx, QTMn, QTMx, yWmn, yWmx
# mt_met    = 50.0, 10000., 25.0                          # MT min, MT max, ETmiss min -- verify against the actual published CDF selection before using for a real analysis
#
# [cuts.d0]                               # ILLUSTRATIVE ONLY -- ballpark D0 Run II W -> e nu-style (central calo)
# lepton    = 25.0, -10, 0.0, 10000.0, 1.05               # PTECUT, YECUT, DelR, PTNCUT(max), YnCut(max |eta|, D0 central calo ~1.05)
# mass_qt_y = {qwindow}, 0.0, 8000.0, -99.0, 99.0         # QMn, QMx, QTMn, QTMx, yWmn, yWmx
# mt_met    = 50.0, 10000., 25.0                          # MT min, MT max, ETmiss min -- verify against the actual published D0 selection before using for a real analysis
#
[cuts.nocuts]                           # no lepton cuts: cut later on the ntuple
lepton    = 0.0, -10, 0.0, 15000.0, 99.0
mt_met    = 0.0, 15000., 0.0

[environment]                           # optional; the defaults are the ones in the working example's .sb files
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
