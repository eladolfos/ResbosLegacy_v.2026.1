# E201_e605_full.ini  --  E605 (fixed target, A0/photon Drell-Yan continuum), full data-driven grid
#
#   python3 run_process.py E201_e605_full.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py E201_e605_full.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file.
#
# STATUS: this is the promoted version of E201_e605.ini (single test point, already validated end to
# end) to the full E605 grid.
#   - templates/E605_full/{legacy,w_pert,w_asym}/inp/{q,y}_grid.inp were generated with
#     make_grid_from_data.py from the real 119-point E605 data table (Workspace/FixedTargetKFactor/
#     e605/e605 in New_kFactorCT25/FixedTarget_pp830a016_yao_09182026/): 18 unique Q x 7 unique y =
#     126 grid points, i.e. every measured (Q,y) pair plus 7 unmeasured combinations (harmless).
#     qt_grid.inp is unchanged (the same real 47-point grid used in E201_e605.ini).
#   - This is a genuine alternative to Yao's run.sh (one job per point, 119 separate legacy/w_pert
#     runs): here it's ONE rectangular-grid job, computed by run_process.py's normal single-grid
#     campaign machinery -- no per-point looping needed, since 126 vs 119 points is close enough
#     that the "extra" unmeasured combinations aren't worth avoiding. If a future experiment's
#     unique-Q x unique-y product is much larger than its point count (sparse/irregular coverage),
#     this rectangular-grid approach wastes a lot of compute and a true per-point campaign (like
#     run.sh) is the better fit -- ask before reusing this pattern blindly for a new experiment.
#   - Same physics constants as E201_e605.ini (see that file's own notes): ECM=38.8, iBeam=0,
#     FRACT_N=0.54 (Cu target), JWTYPE=2 for A0, get_yk_new's A0/NLO branch (STOPs at NNLO).

[paths]
# templates/E605_full/ is new (created in this repo, not yet on the HPCC install) -- sync it to
# /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/E605_full before running there.
source = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/E605_full
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/E201_e605_full
shard_scripts  = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/shrds_scripts
stage_outputs = link

[campaign]
name       = E201_e605f                   # short: E201_e605 is already used by the single-point campaign
ecm        = 38.8
processes  = A0
pdf        = CT25NNLO
order      = NLO

[executables]
dir        = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin

[templates]
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in
w_pert      = w_pert/7TeV_w_pert_Wp.in
w_asym      = w_asym/7TeV_w_asym_Wp.in
resbos      = resbos/7TeV_Wp_resbos.in

[grids]
# Default: the full grid in <folder>/inp/{q,qt,y}_grid.inp -- 18 Q x 47 qT x 7 y = 5922 points.
# No [grids] active override needed; the whole (data-driven) grid is meant to run.

[shards]                                  # 18 Q points, still tiny next to the 80-point LHC grid
legacy     = 1
w_pert     = 1
w_asym     = 1

[get_yk_new]
# Only for order = NNLO (STOPs for A0 anyway -- not needed at NLO).
# r_ai_A0 = /path/to/R_Ai_e605.txt

[legacy]                                  # E605 = fixed target on a Cu nucleus
bmax    = 0.5
nonpert = 0.21d0, 0.68d0, -0.126d0, 1.6d0, 1     # g1, g2, g3, Q0, nG  (BLNY)
ibeam   = 0
fract_n = 0.54d0

[resbos]
runs    = nocuts                        # 7TeV_Wp_resbos.in's own cuts are LHC W+->lepton+MET cuts,
                                         # meaningless for E605's dimuon continuum -- strip them

[cuts.nocuts]
lepton    = 0.0, -10, 0.0, 10000.0, 99.0
mt_met    = 0.0, 10000., 0.0

[environment]
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
