# E201_e605.ini  --  E605 (fixed target, A0/photon Drell-Yan continuum), single test point
#
#   python3 run_process.py E201_e605.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py E201_e605.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file.
#
# STATUS: single-point sanity check, not the full E605 campaign.
#   - Physics constants (ECM, iBeam, FRACT_N, JWTYPE, PDF) come from actual prior E605 runs found in
#     New_kFactorCT25/FixedTarget_pp830a016_yao_09182026/ (Workspace/LO/e605/legacy.in and
#     Workspace/FixedTargetKFactor/e605/w_pert.in), not guessed.
#   - The real E605 campaign there computes on the 119 (y,Q) points measured by the experiment
#     (Workspace/LO/e605/run.sh loops over the "e605" data table, one Legacy/w_pert job per point,
#     full qT swept each time). run_process.py only supports ONE shared (Q,qT,y) rectangular grid, so
#     this .ini instead uses a single representative point -- the data table's first row (y=-0.200,
#     Q=7.10) -- with the real 47-point qT grid, to prove the pipeline + A0 physics work end to end.
#     Replicating the full 119-point campaign needs either 119 of these .ini files (one per point,
#     changing [templates]'s source grid) or a driver change to loop the way run.sh does.
#   - get_yk_new.f (get_yk_new/get_yk_new.f:181-200) now has an A0 branch: its "convert" factor is
#     provably unused at NLO (only referenced in the iorder=="NNLO" branch), so get_yk_new runs through
#     for A0/NLO with a placeholder convert_0=1.0D0. It explicitly STOPs if A0 is ever run at NNLO (no
#     real conversion constant implemented for that case).

[paths]
# templates/E605_test/ is new (created in this repo, not yet on the HPCC install) -- sync it to
# /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/E605_test before running there.
source = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/E605_test
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/E201_e605_test
shard_scripts  =/mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/shrds_scripts          # default: the shrds_scripts folder next to this script
stage_outputs = link

[campaign]
name       = E201_e605                    # prefix of every file; keep it short (Fortran truncates paths at 100 chars)
ecm        = 38.8                         # GeV; matches Workspace/FixedTargetKFactor/e605/w_pert.in (legacy.in there says 38.75 -- 0.05 GeV difference, immaterial)
processes  = A0                           # photon / DY-continuum (case-sensitive key: must be "A0", not "a0")
pdf        = CT25NNLO                    # LHAPDF set actually used in the prior E605 runs (lha_pp830a016); NOT CT25NNLO despite this campaign's scratch folder name -- change if you actually want CT25NNLO
order      = NLO                          # get_yk_new order (irrelevant here: get_yk_new will STOP on A0 regardless, see above)

[executables]                             # default: bin/<folder>/<exe>, the fresh build made by  sbatch setup_resbos_legacy.sb
dir        = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin
w_pert     = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin/w_pert
w_asym     = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin/w_asym
legacy     = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin/legacy
get_yk_new = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin/get_yk_new
resbos     = /path/to/resbos_root

[templates]
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in          # LTO=3 -> input of get_yk_new
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in     # LTO=0 -> "Main data grid" of resbos
w_pert      = w_pert/7TeV_w_pert_Wp.in
w_asym      = w_asym/7TeV_w_asym_Wp.in
resbos      = resbos/7TeV_Wp_resbos.in

[grids]
# Default: the full grid in <folder>/inp/{q,qt,y}_grid.inp -- here that's already the single test
# point (Q=7.10, y=-0.200, 47 qT points), so no [grids] active override is needed.

[shards]                                  # split along Q; grid has only 1 Q point, so 1 shard each is enough
legacy     = 1
w_pert     = 1
w_asym     = 1

[get_yk_new]
# Only for order = NNLO. Not reached for A0 anyway (see STATUS above).
# r_ai_A0 = /path/to/R_Ai_e605.txt

[legacy]                                  # E605 = fixed target on a Cu nucleus: iBeam=0 (pN), FRACT_N=0.54
bmax    = 0.5                                         # (matches Workspace/LO/e605/legacy.in, the file actually run for E605)
nonpert = 0.21d0, 0.68d0, -0.126d0, 1.6d0, 1     # g1, g2, g3, Q0, nG  (BLNY)
ibeam   = 0
fract_n = 0.54d0

[resbos]                                # not expected to run (depends on get_yk_new's Yk grid, which fails for A0)
runs    = nocuts

[environment]                           # optional; the defaults are the ones in the working example's .sb files
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
