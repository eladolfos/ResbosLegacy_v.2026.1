# E201_e605_fine.ini  --  E605 (fixed target, A0/photon Drell-Yan continuum), fine dense grid
#
#   python3 run_process.py E201_e605_fine.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py E201_e605_fine.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file.
#
# STATUS: the real analog of the 7TeV example for E605 -- a genuine fine, dense (Q,qT,y) grid
# (not tied to where E605 happened to measure), so resbos can actually interpolate and produce a
# real resNLO result, the same way it does for the LHC campaigns.
#   - [grids] generate builds the Q/y grid in-process (make_grid_from_data.py's "generate" mode,
#     called from run_process.py itself -- no separate script invocation needed) and writes it into
#     templates/E605_fine/{legacy,w_pert,w_asym}/inp/{q,y}_grid.inp before the normal build() runs.
#     40 Q points x 25 y points, linear spacing:
#       Q: 4.0 - 20.0 GeV   (real E605 data spans ~7.1-16.91 GeV; margin on both sides)
#       y: -0.5 - 0.5       (real E605 data spans ~-0.2 to 0.4; margin on both sides)
#     qT: the real 47-point qt_grid.inp (Workspace/LO/e605/inp/qt_grid.inp), untouched.
#     40 x 25 x 47 = 47,000 points/boson -- small next to the LHC example's 1.75M, should run in
#     well under an hour serial per the reference timings.
#   - [templates] reuses the same E605_test/A0 .in structure as the other three E605 .ini files
#     (E201_e605.ini, E201_e605_full.ini, E201_e605_points.ini) -- only the grid differs here.
#     Same physics constants: ECM=38.8, iBeam=0, FRACT_N=0.54 (Cu target), JWTYPE=2 for A0.
#   - Unlike E201_e605_points.ini, this DOES reach a real resbos/.root result: the grid is a
#     genuine, complete rectangle (no gaps), so both get_yk_new's and resbos_root.f's CheckSum
#     (NQ*Ny*NqT == rows) pass on real, non-padded values throughout.
#   - Adjust n_q/n_y/q_min/q_max/y_min/y_max below to change resolution or range; rerun with
#     --reuse to regenerate the grid and refresh the campaign.

[paths]
source = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/E605_fine
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/E201_e605_fine
shard_scripts  = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/shrds_scripts
stage_outputs = link

[campaign]
name       = E201_e605n                   # short: E201_e605/e605f/e605p already used by the other three E605 campaigns
ecm        = 38.8
processes  = A0
pdf        = CT25NNLO
order      = NLO

[executables]
dir        = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin

[templates]
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in
w_pert      = w_pert/7TeV_w_pert_Wp.in
w_asym      = w_asym/7TeV_w_asym_Wp.in
resbos      = resbos/7TeV_Wp_resbos.in

[grids]
generate  = yes
n_q       = 40
n_y       = 25
q_min     = 4.0
q_max     = 20.0
q_spacing = linear
y_min     = -0.5
y_max     = 0.5
y_spacing = linear
# Alternative to q_min/q_max/y_min/y_max: derive the range from the real data table's own
# min/max instead of typing it by hand (still generates a FULL dense grid over that span,
# unlike [grids] experimental or make_grid_from_data.py's "unique" mode):
# q_from = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/FixTargetTables/e605
# y_from = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/FixTargetTables/e605

[shards]                                  # 40 Q points, still tiny next to the 80-point LHC grid
legacy     = 40
w_pert     = 40
w_asym     = 40

[get_yk_new]
# Only for order = NNLO (STOPs for A0 anyway -- not needed at NLO).
# r_ai_A0 = /path/to/R_Ai_e605.txt

[legacy]                                  # E605 = fixed target on a Cu nucleus
bmax    = 0.5
nonpert = 0.21d0, 0.68d0, -0.126d0, 1.6d0, 1     # g1, g2, g3, Q0, nG  (BLNY)
ibeam   = 0
fract_n = 0.54d0

[resbos]
runs    = nocuts                        # 7TeV_Wp_resbos.in's own cuts are LHC W+->lepton+MET cuts,
                                         # meaningless for E605's dimuon continuum -- strip them

[cuts.nocuts]
lepton    = 0.0, -10, 0.0, 10000.0, 99.0
mt_met    = 0.0, 10000., 0.0

[environment]
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
