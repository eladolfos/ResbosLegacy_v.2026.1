# E201_e605_points.ini  --  E605 (fixed target, A0/photon Drell-Yan continuum), ExpCustomGrid mode
#
#   python3 run_process.py E201_e605_points.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py E201_e605_points.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file.
#
# STATUS: the real, literal E605 methodology -- one job per (y,Q) row of the actual 119-point E605
# data table (Workspace/FixedTargetKFactor/e605/e605 in New_kFactorCT25/FixedTarget_pp830a016_yao_09182026/),
# exactly like Yao's own run.sh/combine.sh, but run through run_process.py's ExpCustomGrid mode
# (ARRAY_ID=... 119 jobs -> SLURM array per stage -> merge) instead of a serial bash loop.
#   - [templates] reuses templates/E605_test as-is: [grids] experimental completely overrides Q and y
#     per point (single-value files it writes itself) and only borrows the qT grid from the template's
#     own inp/qt_grid.inp, so E605_test's own single-point q_grid.inp/y_grid.inp are never read in this
#     mode -- no new template was needed, matching what you assumed.
#   - Compare with E201_e605.ini (single point, sanity check, still valid) and E201_e605_full.ini
#     (rectangular grid built from the table's 18 unique Q x 7 unique y = 126 points, only 6% "extra"
#     unmeasured combinations -- a reasonable approximation for E605 specifically). This .ini instead
#     computes exactly the 119 real points, no more, no less.
#   - Same physics constants as those two: ECM=38.8, iBeam=0, FRACT_N=0.54 (Cu target), JWTYPE=2 for A0.
#   - w_pert/w_asym/legacy_Y/legacy_main run per point (119x each) and are merged into <job>_combined.out
#     each; get_yk_new and resbos THEN run once (per boson), fed those merged files -- the merged files
#     keep the same (Q,qT,y) row order across w_pert/w_asym/legacy_Y (same 119 points, same qT grid,
#     written identically for all four stages), which is all get_yk_new's row-by-row match check needs.
#     So this .ini DOES reach a real resbos result, same as E201_e605.ini/E201_e605_full.ini -- just
#     built from the exact 119 measured points instead of a single point or an approximate rectangle.

[paths]
source = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/E605_test
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/E201_e605_points
shard_scripts  = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/shrds_scripts   # unused in this mode, harmless to leave set
stage_outputs = link

[campaign]
name       = E201_e605p                   # short: E201_e605/E201_e605f are already used by the other two campaigns
ecm        = 38.8
processes  = A0
pdf        = CT25NNLO
order      = NLO                          # get_yk_new order (STOPs for A0 at NNLO -- see get_yk_new.f notes)

[executables]
dir        = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin

[templates]
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in
w_pert      = w_pert/7TeV_w_pert_Wp.in
w_asym      = w_asym/7TeV_w_asym_Wp.in
resbos      = resbos/7TeV_Wp_resbos.in

[grids]
experimental = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/FixTargetTables/e605
# exp_y_col = 1                           # default: column 1 = y, matches this table (and Yao's run.sh)
# exp_q_col = 2                           # default: column 2 = Q
# throttle  = 20                          # optional: cap concurrent point jobs, e.g. 1-119%20

[legacy]                                  # E605 = fixed target on a Cu nucleus
bmax    = 0.5
nonpert = 0.21d0, 0.68d0, -0.126d0, 1.6d0, 1     # g1, g2, g3, Q0, nG  (BLNY)
ibeam   = 0
fract_n = 0.54d0

[get_yk_new]
# Only for order = NNLO (STOPs for A0 anyway -- not needed at NLO).
# r_ai_A0 = /path/to/R_Ai_e605.txt

[resbos]
runs    = nocuts                        # 7TeV_Wp_resbos.in's own cuts are LHC W+->lepton+MET cuts,
                                         # meaningless for E605's dimuon continuum -- strip them

[cuts.nocuts]
lepton    = 0.0, -10, 0.0, 10000.0, 99.0
mt_met    = 0.0, 10000., 0.0

[environment]
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
