# E201_e605_NLO_resNLO.ini  --  E605 (fixed target, A0/photon Drell-Yan), same fine dense grid
# as E201_e605_fine.ini, but computing BOTH resNLO (CSS-resummed) and NLO (fixed order) in one
# campaign -- see README.md "One-file campaign driver" -> "compute: resNLO, NLO, or both" for the
# full explanation of what each one means and why the NLO piece needs [grids] generate (a real,
# gap-free grid), same as resNLO already did here.
#
#   python3 run_process.py E201_e605_NLO_resNLO.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py E201_e605_NLO_resNLO.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file.
#
# WHAT compute = NLO, resNLO ADDS on top of E201_e605_fine.ini's resNLO-only campaign:
#   - Legacy LTO=1 (legacy_dsi, "DeltaSigma"/2->2 singular piece) and LTO=2 (legacy_asy,
#     "Asymptotic") -- two NEW Legacy runs, on the SAME grid as legacy_Y (LTO=3, shared with
#     resNLO -- computed once regardless of which compute values are listed).
#   - Two extra resbos runs per boson per [resbos] run name: one with Main=legacy_asy +
#     Y=legacy_Y (qT > qT_Sep piece), one with Main=legacy_dsi + Y="-" (qT < qT_Sep piece, no
#     Y-piece at all). w_pert/w_asym/get_yk_new are NOT needed for NLO (only resNLO's K-factor
#     grid uses them) -- see [templates]: no [templates] legacy_dsi/legacy_asy keys are given
#     below, so they default to the SAME LTO=3 template as legacy_Y (the LTO field is
#     overwritten by the driver regardless of what the template file starts with).
#   - A hadd job combining the two resbos .root files into <name>_<tag>_<run>_NLO.root -- the
#     qT_Sep dependence between the two pieces cancels in the sum (phase-space slicing).
#
# REUSE: if you already ran E201_e605_fine.ini (or this file with compute=resNLO only) into the
# SAME [paths] dest, rerunning this file with --reuse will detect the existing, already-valid
# w_pert/w_asym/legacy_Y/legacy_main/get_yk_new/resbos outputs and skip resubmitting them --
# only the new legacy_dsi/legacy_asy/resbos(x2)/hadd pieces get queued. To layer NLO onto an
# already-finished E201_e605_fine.ini run without recomputing anything: copy this file, point
# [paths] dest at that SAME finished dest folder, and run with --reuse.

[paths]
source = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/templates/E605_fine
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/E201_e605_NLO_resNLO
shard_scripts  = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/shrds_scripts
stage_outputs = link

[campaign]
name       = E201_e605c                   # short, distinct from e605n/e605f/e605p/e605 (the other E605 campaigns)
ecm        = 38.8
processes  = A0
pdf        = CT25NNLO
order      = NLO                          # only affects resNLO's get_yk_new K-factor; ignored by the NLO pipeline
compute    = NLO, resNLO                  # the option this example demonstrates -- also valid: "NLO" or "resNLO" alone

[executables]
dir        = /mnt/home/lopezels/InstallSources/ResbosLegacy_v.2026.1/bin

[templates]
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in
w_pert      = w_pert/7TeV_w_pert_Wp.in
w_asym      = w_asym/7TeV_w_asym_Wp.in
resbos      = resbos/7TeV_Wp_resbos.in
# legacy_dsi = legacy/7TeV_legacy_Wp_W321.in       # optional override; defaults to legacy_Y's own file
# legacy_asy = legacy/7TeV_legacy_Wp_W321.in       # (LTO is rewritten by the driver either way)

[grids]
generate  = yes                           # NLO, like resNLO, needs a real gap-free (Q,qT,y) rectangle
n_q       = 40                            # (ExpCustomGrid mode -- [grids] experimental -- does not support NLO)
n_y       = 25
q_min     = 4.0
q_max     = 20.0
q_spacing = linear
y_min     = -0.5
y_max     = 0.5
y_spacing = linear

[shards]                                  # legacy now runs 4 passes (Y, main, dsi, asy) per boson, same 40 shards each
legacy     = 40
w_pert     = 40
w_asym     = 40

[get_yk_new]
# Only for order = NNLO (STOPs for A0 anyway -- not needed at NLO).
# r_ai_A0 = /path/to/R_Ai_e605.txt

[legacy]                                  # E605 = fixed target on a Cu nucleus
bmax    = 0.5
nonpert = 0.21d0, 0.68d0, -0.126d0, 1.6d0, 1     # g1, g2, g3, Q0, nG  (BLNY)
ibeam   = 0
fract_n = 0.54d0

[resbos]
runs    = nocuts                        # 7TeV_Wp_resbos.in's own cuts are LHC W+->lepton+MET cuts,
                                         # meaningless for E605's dimuon continuum -- strip them.
                                         # Used for resNLO's run AND both of NLO's runs (asy+Y, dsi-alone).

[cuts.nocuts]
lepton    = 0.0, -10, 0.0, 10000.0, 99.0
mt_met    = 0.0, 10000., 0.0

[environment]
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
