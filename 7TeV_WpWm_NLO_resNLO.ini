# 7TeV_WpWm_NLO_resNLO.ini  --  W+ / W- at 7 TeV, same template as 7TeV_WpWm_example.ini, but
# computing BOTH resNLO (CSS-resummed) and NLO (fixed order, phase-space slicing + hadd) in one
# campaign. See README.md "One-file campaign driver" -> "compute: resNLO, NLO, or both" for the
# full explanation of the two workflows and why they're valid/what pieces each needs.
#
#   python3 run_process.py 7TeV_WpWm_NLO_resNLO.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py 7TeV_WpWm_NLO_resNLO.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file.
#
# WHAT compute = NLO, resNLO ADDS on top of 7TeV_WpWm_example.ini's resNLO-only campaign:
#   - Legacy LTO=1 (legacy_dsi) and LTO=2 (legacy_asy) -- two new Legacy runs on the same grid
#     as legacy_Y (LTO=3, shared with resNLO -- computed once either way).
#   - Two extra resbos runs per boson per [resbos] run name (asy+Y piece for qT>qT_Sep,
#     dsi-alone for qT<qT_Sep), then a hadd job combining them into <name>_<tag>_<run>_NLO.root.
#   - w_pert/w_asym/get_yk_new are untouched by NLO (only resNLO's K-factor grid needs them).
#
# This example keeps the full reference 80x153x143 grid, so with BOTH pipelines on it is a long
# run (legacy now does 4 passes instead of 2 per boson: roughly double the ~16h serial Legacy
# time on top of the original resNLO chain, sharded the same way). For a quicker first try,
# either shrink [grids] active or set processes = W+ only.
#
# REUSE: rerunning this file with --reuse against a dest that already has 7TeV_WpWm_example.ini's
# finished resNLO outputs (same [paths] dest) will detect and skip w_pert/w_asym/legacy_Y/
# legacy_main/get_yk_new/resbos, and only queue the new legacy_dsi/legacy_asy/resbos(x2)/hadd
# pieces -- see the row-count/'.root exists' checks the driver prints for each stage.

[paths]
source = templates/7TeV_WpWm
dest   = run_7TeV_WpWm_NLO_resNLO
# shard_scripts  = shrds_scripts
# stage_outputs  = link

[campaign]
name       = 7TeVc                        # distinct from 7TeV (the resNLO-only example's own [campaign] name)
ecm        = 7000
processes  = W+, W-
pdf        = CT25NNLO
order      = NLO                          # only affects resNLO's get_yk_new K-factor; ignored by the NLO pipeline
compute    = NLO, resNLO                  # the option this example demonstrates -- also valid: "NLO" or "resNLO" alone

[executables]
# dir        = bin
# w_pert     = /path/to/w_pert
# w_asym     = /path/to/w_asym
# legacy     = /path/to/main
# get_yk_new = /path/to/get_yk_new
# resbos     = /path/to/resbos_root

[templates]
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in
w_pert      = w_pert/7TeV_w_pert_Wp.in
w_asym      = w_asym/7TeV_w_asym_Wp.in
resbos      = resbos/7TeV_Wp_resbos.in
# legacy_dsi = legacy/7TeV_legacy_Wp_W321.in       # optional override; defaults to legacy_Y's own file
# legacy_asy = legacy/7TeV_legacy_Wp_W321.in       # (LTO is rewritten by the driver either way)

[grids]
# Default: the full grid in <folder>/inp/{q,qt,y}_grid.inp. Optional sub-range, e.g. for a
# quick first try of the NLO pipeline before committing to the full grid:
# active = 1 153 1  1 143 1  1 80 1       # qT_min qT_max step   y_min y_max step   Q_min Q_max step

[shards]                                  # legacy now runs 4 passes (Y, main, dsi, asy) per boson
legacy     = 20
w_pert     = 4
w_asym     = 4

[get_yk_new]
# Only for order = NNLO. With NLO an all-ones R_Ai table is generated (identical result).
# r_ai_Wp = /path/to/R_Ai_wp.txt
# r_ai_Wm = /path/to/R_Ai_wm.txt

# [resbos]
# runs    = atlas, nocuts                 # used for resNLO's run AND both of NLO's runs (asy+Y, dsi-alone)
# vegas   = 1,30,30000,50,500000
# seed    = 182019
# lumi    = 1.0
# output  = ROOTNT2
# qwindow = 10.0, 150.0
#
# [cuts.atlas]
# lepton    = 25.0, -10, 0.0, 10000.0, 2.4
# mass_qt_y = {qwindow}, 0.0, 8000.0, -99.0, 99.0
# mt_met    = 40.0, 10000., 25.0
#
# [cuts.nocuts]
# lepton    = 0.0, -10, 0.0, 10000.0, 99.0
# mt_met    = 0.0, 10000., 0.0

# [environment]
# modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
# lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
# hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
# root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh
